language: "en-US"
tone_instructions: >
  Prioritize bugs, logic errors, and security issues. Post only critical issues
  as actionable comments. All other findings — style, best practices, minor
  improvements — must be nitpick comments.

reviews:
  request_changes_workflow: false
  profile: "chill"
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    base_branches: ["main"]
    path_filters:
      - "!docs/**"
      - "!**/README.md"
      - "!PLUGINS.md"
  path_instructions:
    - path: "plugins/patternfly/**"
      instructions: >
        PatternFly plugin domain. If this PR also modifies files under
        plugins/uxd-*, flag it as a cross-boundary change and verify that
        both team approvals are required via CODEOWNERS.
    - path: "plugins/uxd-*/**"
      instructions: >
        UXD plugin domain. If this PR also modifies files under
        plugins/patternfly/, flag it as a cross-boundary change and verify
        that both team approvals are required via CODEOWNERS.
    - path: "plugins/**/SKILL.md"
      instructions: >
        These files are AI instruction files — they describe workflows for AI
        assistants to follow, not directly executable code. The AI tool's runtime
        handles permissions and user confirmation.

        Review against CONTRIBUTING-SKILLS.md. Check: frontmatter has name and
        description, description includes trigger contexts, content describes
        outcomes not implementation, skill is tool-agnostic (must work in both
        Claude Code and Cursor — no tool-specific references). Security: flag
        hardcoded secrets, tokens, or credentials in the instruction text itself.
        Do NOT flag instructions that describe cross-project workflows, filesystem
        searches within the user's project, or interactive CLI commands — these
        are mediated by the AI runtime's permission system. Do not flag pf- or
        uxd- prefix naming or markdown formatting.
    - path: "plugins/**/skills/**"
      instructions: >
        Consumer-facing skills are expected to have an eval colocated at
        skills/<skill-name>/eval/eval.yaml. If this PR adds or significantly
        modifies a consumer skill and no corresponding eval exists, flag it
        as a nitpick reminder.
    - path: "plugins/**/agents/*.md"
      instructions: >
        Review against CONTRIBUTING-SKILLS.md. Agents provide domain knowledge
        the AI follows across all interactions in the plugin's area — they are
        not tasks that produce results (those are skills). Must be tool-agnostic.
        Agent descriptions follow a different pattern than skills: [Domain noun]
        [what it covers]. [Active when + context.] — no action-verb lead-ins.
        Flag agents that use the skill formula (action-verb lead-ins like
        "Define", "Standardize", "Generate").
    - path: "**/.claude-plugin/**"
      instructions: >
        Manifests must be identical in .claude-plugin/ and .cursor-plugin/.
        If this file changed, verify the corresponding file in the other
        directory has the exact same content. Flag any differences.
    - path: "**/.cursor-plugin/**"
      instructions: >
        Manifests must be identical in .claude-plugin/ and .cursor-plugin/.
        If this file changed, verify the corresponding file in the other
        directory has the exact same content. Flag any differences.
    - path: "plugins/**/*.{js,sh,py,ts}"
      instructions: >
        Review for bugs, logic errors, security issues, and broken behavior.
        Security checklist: flag hardcoded secrets, tokens, or credentials, curl piped to
        shell (curl | bash), use of --no-verify or --force flags, unquoted
        variables in shell commands, use of eval or exec, access to
        files outside the target project without stating why, and sending
        data to external services without explicit user confirmation. Do not
        flag style or formatting.
    - path: ".github/workflows/**"
      instructions: >
        GitHub Actions workflow files. Security checklist: actions must be
        pinned to commit SHAs (not mutable tags like @v4), permissions must
        be scoped to individual jobs (not workflow level), checkout steps
        must set persist-credentials: false, secrets must not be exposed to
        jobs that don't need them, and ${{ }} expressions must not appear
        in run: blocks with user-controlled input (use env: instead). Flag
        npm install or plugin install commands that use floating versions.
    - path: "scripts/**"
      instructions: >
        Repo-level automation scripts. Review for bugs, correctness, and
        broken behavior. Security checklist: flag hardcoded secrets, tokens,
        or credentials, curl piped to shell (curl | bash), use of --no-verify
        or --force flags, unquoted variables in shell commands, use of eval
        or exec. Do not flag style or formatting.
    # Table suppression: the plugin table is regenerated by generate-plugins-md.sh
    # on every merge. Flagging drift between the table and plugins/ is noise.
    - path: "CONTRIBUTING*.md"
      instructions: >
        Source-of-truth guidelines that CodeRabbit and human reviewers use to
        evaluate all contributions. Changes here affect every future review.
        Verify accuracy and check for contradictions. The plugin taxonomy table
        between <!-- BEGIN PLUGIN TABLE --> and <!-- END PLUGIN TABLE --> markers
        is auto-generated by scripts/generate-plugins-md.sh — do NOT flag
        inconsistencies between this table and the plugins/ directory. MCP-only
        plugins (pf-mcp) are intentionally excluded from the skill-placement
        table since they host no skills.
    # Eval suppressions exist because CodeRabbit's AI previously fabricated
    # requirements (plugin_dirs) and misapplied repo naming rules to React
    # fixture files. Each "do NOT flag" maps to a confirmed false positive.
    - path: "plugins/**/eval/**"
      instructions: >
        Eval configs and test cases colocated with their skills. Each eval lives
        at skills/<skill-name>/eval/eval.yaml. Test cases should be discriminating
        (test what the skill uniquely contributes, not base model knowledge).
        Fixture .tsx files follow React PascalCase naming convention (e.g.
        ClusterDashboard.tsx, UserProfileCard.tsx) — do NOT flag for kebab-case;
        the repo kebab-case rule applies to directories and non-component files,
        not React component fixtures. The plugin_dirs field in runner config is
        optional and most evals omit it — do NOT flag it as missing. Fixture
        files should not contain comments that disclose expected findings (the
        bugs should be present in code without hints).

    # README suppression: despite !**/README.md in path_filters, CodeRabbit
    # still reviews README.md when other files trigger review. This instruction
    # prevents false positives on auto-generated and illustrative content.
    - path: "README.md"
      instructions: >
        The plugin table between <!-- BEGIN PLUGIN TABLE --> and
        <!-- END PLUGIN TABLE --> markers is auto-generated by
        scripts/generate-plugins-md.sh. Do NOT flag inconsistencies between
        this table and the plugins/ directory structure. The directory tree
        diagram is illustrative, not exhaustive — do NOT flag missing entries.

knowledge_base:
  web_search:
    enabled: false
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "CONTRIBUTING-SKILLS.md"
