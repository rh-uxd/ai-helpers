# Fullsend per-repository configuration.
# The workflow scaffold is maintained by Fullsend; this file contains the
# repository-specific agent configuration.
version: "1"
runtime: pi
roles:
  - review
agents:
  - name: review
    source: harness/review.yaml
    model: google-vertex/gemini-3.8-flash
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
inference:
  provider: vertex
  region: global
  # project and wif_provider are supplied at runtime by the protected
  # FULLSEND_GCP_PROJECT_ID and FULLSEND_GCP_WIF_PROVIDER secrets.
