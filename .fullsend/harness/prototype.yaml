# Custom prototype agent harness.
#
# NOT derived from the code agent — the code agent's providers (vertex-ai,
# gitleaks, package-registries) require CI-only credentials. This harness
# is self-contained with only the providers needed for prototyping.
#
# Flow: pre_script → sandbox (prototype agent) → post_script (skipped locally)
agent: agents/prototype.md
doc: docs/prototype.md
description: "UX prototype creator — generates PatternFly prototypes from feature descriptions"

model: opus
effort: high
role: coder
slug: fullsend-ai-prototype

image: ghcr.io/fullsend-ai/fullsend-code@sha256:6961dc3cf51abbb94291dea02c8d69a7aa33df1f146c6ae5c33304b27eb2203e
policy: policies/base.yaml

# Claude runtime needs api.anthropic.com access from the sandbox.
# Provider "anthropic-api" (type fullsend-anthropic-api) must exist on
# the openshell gateway — create with:
#   openshell provider create --name anthropic-api --type fullsend-anthropic-api --credential ANTHROPIC_API_KEY=...
# The profile defines the endpoint; the provider injects it into OPA policy.
openshell:
  profiles:
    - profiles/anthropic-api.yaml
providers:
  - providers/anthropic.yaml

pre_script: scripts/pre-prototype.sh

# Pre-script writes issue JSON to a file; mount it into the sandbox.
# The sandbox reads the file instead of making authenticated API calls.
host_files:
  - src: ${RUNNER_TEMP:-/tmp}/issue-context.json
    dest: /tmp/issue-context.json
    optional: true

# No post-script for v1: during testing, use fullsend run --no-post-script
# and inspect output manually. For CI, the upstream code agent's post-script
# (push branch, create PR) will be referenced here once the agent is validated.

# The prototype-context skill provides autonomous prototyping instructions.
# GitHub-only for v1. Jira/GitLab overlays planned.
skills:
  - skills/prototype-context

validation_loop:
  script: scripts/validate-prototype-output.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/prototype-result.schema.json
  max_iterations: 2
  feedback_mode: append

# Prototype generation triggers.
trigger: >
  event.entity.kind == "work_item"
    && (
      (event.transition.kind == "label_changed"
        && event.transition.label.action == "added"
        && event.transition.label.name == "ready-to-prototype")
      ||
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-prototype")
    )

allow_runtime_fetch: true
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://raw.githubusercontent.com/rh-uxd/ai-helpers/

timeout_minutes: 60

env:
  runner:
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    PUSH_TOKEN: "${PUSH_TOKEN}"
    PUSH_TOKEN_SOURCE: "${PUSH_TOKEN_SOURCE}"
    ISSUE_NUMBER: "${ISSUE_NUMBER}"
    ISSUE_URL: "${GITHUB_ISSUE_URL}"
    GH_TOKEN: "${GH_TOKEN}"
    FULLSEND_FORGE: github
  sandbox:
    ISSUE_NUMBER: "${ISSUE_NUMBER}"
    ISSUE_URL: "${GITHUB_ISSUE_URL}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    FULLSEND_FORGE: github
    GIT_AUTHOR_NAME: "fullsend-prototype"
    GIT_AUTHOR_EMAIL: "${GIT_BOT_EMAIL}"
    GIT_COMMITTER_NAME: "fullsend-prototype"
    GIT_COMMITTER_EMAIL: "${GIT_BOT_EMAIL}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
