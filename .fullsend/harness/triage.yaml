# Jira-specific routing overlay over the pinned upstream triage harness.
base: https://raw.githubusercontent.com/fullsend-ai/agents/87a43fcb849546b267a619434ca19dedde8df476/harness/triage.yaml#sha256=ae07e51bb1f634bbb842a498f9ca4cd588982c7811d1ae4c07a06232e50a231b

# Only an explicitly routed, human-requested Jira triage event may dispatch.
# The exactly-one repo label check prevents cross-repository ambiguity.
trigger: >
  event.source.system == "jira"
    && event.entity.kind == "work_item"
    && "repo:rh-uxd/ai-helpers" in event.state.labels
    && event.state.labels.filter(label, label.startsWith("repo:")).size() == 1
    && (
      (event.transition.kind == "label_changed"
        && event.transition.label.action == "added"
        && event.transition.label.name == "ready-to-triage")
      ||
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-triage")
    )

# Require a human decision before Jira work can be handed to the code agent.
env:
  runner:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
  sandbox:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
