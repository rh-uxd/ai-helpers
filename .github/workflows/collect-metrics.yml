name: Collect Adoption Metrics

on:
  schedule:
    - cron: '17 8 * * 1'  # Weekly on Monday ~8am UTC (offset to avoid GHA queue congestion)
  workflow_dispatch:

concurrency:
  group: collect-metrics

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Collect metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          DATE=$(date -u +%Y-%m-%d)

          VIEWS_JSON=$(gh api "repos/${REPO}/traffic/views")
          VISITORS=$(echo "${VIEWS_JSON}" | jq '.uniques')
          TOTAL_VIEWS=$(echo "${VIEWS_JSON}" | jq '.count')

          REPO_REFS_RAW=$(gh api "search/code?q=%22rh-uxd/ai-helpers%22+NOT+repo:rh-uxd/ai-helpers+NOT+repo:rh-uxd/ai-helpers-internal&per_page=100")
          REPO_REFS=$(echo "${REPO_REFS_RAW}" | jq '.total_count')
          echo "${REPO_REFS_RAW}" | jq '[.items | group_by(.repository.full_name)[] | {name: .[0].repository.full_name, url: .[0].repository.html_url, description: (.[0].repository.description // ""), files: [.[].path]}] | sort_by(.name)' > metrics/repo-references.json

          # GITHUB_TOKEN lacks org:read — hardcoded maintainers list (update when team changes)
          MAINTAINERS="-author:jpuzz0+-author:dlabaj+-author:andybraren"
          EXTERNAL_ISSUES=$(gh api "search/issues?q=repo:${REPO}+is:issue+is:open+${MAINTAINERS}" --jq '.total_count')
          EXTERNAL_PRS=$(gh api "search/issues?q=repo:${REPO}+is:pr+${MAINTAINERS}" --jq '.total_count')

          PLUGINS=$(find plugins -name 'plugin.json' -path '*/.claude-plugin/*' | wc -l | tr -d ' ')
          SKILLS=$(find plugins -name 'SKILL.md' | wc -l | tr -d ' ')
          AGENTS=$(find plugins -path '*/agents/*.md' -not -path '*/agents/*/*.md' | wc -l | tr -d ' ')

          plugin_refs() {
            local name="$1"
            sleep 1
            gh api "search/code?q=%22${name}%22+%22rh-uxd/ai-helpers%22+NOT+repo:rh-uxd/ai-helpers" --jq '.total_count'
          }
          PF_REFS=$(plugin_refs "patternfly")
          PF_REACT_REFS=$(plugin_refs "pf-react")
          PF_DESIGN_GUIDE_REFS=$(plugin_refs "pf-design-guide")
          PF_DESIGN_AUDIT_REFS=$(plugin_refs "pf-design-audit")
          PF_MIGRATION_REFS=$(plugin_refs "pf-migration")
          PF_CODE_REVIEW_REFS=$(plugin_refs "pf-code-review")
          PF_MCP_REFS=$(plugin_refs "pf-mcp")
          UXD_WORKSHOP_REFS=$(plugin_refs "uxd-workshop")

          REFERRERS=$(gh api "repos/${REPO}/traffic/popular/referrers")
          PATHS=$(gh api "repos/${REPO}/traffic/popular/paths")
          echo "${REFERRERS}" | jq -r --arg d "$DATE" '.[] | [$d, "referrer", .referrer, (.count|tostring), (.uniques|tostring)] | @csv' >> metrics/traffic-discovery.csv
          echo "${PATHS}" | jq -r --arg d "$DATE" '.[] | [$d, "path", .path, (.count|tostring), (.uniques|tostring)] | @csv' >> metrics/traffic-discovery.csv

          echo "${DATE},${VISITORS},${TOTAL_VIEWS},${REPO_REFS},${EXTERNAL_ISSUES},${EXTERNAL_PRS},${PLUGINS},${SKILLS},${AGENTS},${PF_REFS},${PF_REACT_REFS},${PF_DESIGN_GUIDE_REFS},${PF_DESIGN_AUDIT_REFS},${PF_MIGRATION_REFS},${PF_CODE_REVIEW_REFS},${PF_MCP_REFS},${UXD_WORKSHOP_REFS}" >> metrics/adoption-metrics.csv

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/adoption-metrics.csv metrics/traffic-discovery.csv metrics/repo-references.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: collect weekly adoption metrics"
            git push
          fi
