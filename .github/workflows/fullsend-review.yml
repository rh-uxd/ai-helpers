name: Fullsend Manual PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr checkout $PR_NUMBER

      - name: Install openshell
        run: |
          OPENSHELL_VERSION=0.0.116
          OPENSHELL_SHA=d1155aa70042d3e2ee49dbfa15346b108b7c1d92
          curl -LsSf --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_SHA}/install.sh" \
          | OPENSHELL_VERSION="v${OPENSHELL_VERSION}" sh

      - name: Set up Fullsend
        run: |
          mkdir -p ~/fullsend-bin
          cd ~/fullsend-bin
          curl -fsSL -L https://github.com/fullsend-ai/fullsend/releases/download/v0.43.0/fullsend_0.43.0_linux_amd64.tar.gz | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Fullsend review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GITHUB_PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.inputs.pr_number }}
          PRIOR_REVIEW_SHA: ""
          PRIOR_REVIEW_PROVENANCE: ""
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/.gcp-credentials.json
        run: |
          touch $HOME/.gcp-credentials.json
          fullsend run review \
            --fullsend-dir .fullsend \
            --target-repo . \
            --forge github \
            --runtime codex \
            --model openai/gpt-5.6-luna
