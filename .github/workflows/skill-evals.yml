name: Skill Evals

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "plugins/**/skills/**"
      - "plugins/uxd-a11y/references/**"
      - "scripts/detect-changed-skills.sh"
      - "scripts/parse-eval-results.sh"
      - "scripts/tests/test_skill_eval_scripts.py"
      - ".github/workflows/skill-evals.yml"
      - "plugins/**/agents/**-eval/**"
  workflow_dispatch:
    inputs:
      skill_name:
        description: "Specific skill to evaluate (leave empty for auto-detect)"
        required: false
        type: string

jobs:
  detect-changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-evals')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      has_evals: ${{ steps.detect.outputs.has_evals }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test eval selection and reporting
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/tests/test_skill_eval_scripts.py

      - name: Detect changed skills with evals
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKILL_INPUT: ${{ inputs.skill_name }}
        run: |
          if [[ -n "$SKILL_INPUT" ]]; then
            RESULT=$(bash scripts/detect-changed-skills.sh --skill "$SKILL_INPUT")
          else
            RESULT=$(bash scripts/detect-changed-skills.sh --base origin/main)
          fi
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done <<< "$RESULT"
          echo "$RESULT"

  run-evals:
    needs: detect-changes
    # PR content must never execute with an API key. Only reviewed default-branch
    # content may run, after approval in the protected skill-evals environment.
    if: >-
      needs.detect-changes.outputs.has_evals == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Before enabling: an administrator must configure required reviewers,
    # prevent self-review, and allow deployment only from the default branch.
    # Store the dedicated eval key ONLY here, never as a repo/org secret.
    # Merely naming an environment does not configure its protection rules.
    environment: skill-evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check eval credentials
        id: creds
        env:
          GCP_CREDS: ${{ secrets.GCP_EVAL_CREDENTIALS }}
        run: |
          if [[ -z "$GCP_CREDS" ]]; then
            echo "::error::Configure GCP_EVAL_CREDENTIALS in the protected skill-evals environment."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP
        if: steps.creds.outputs.available == 'true'
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          credentials_json: ${{ secrets.GCP_EVAL_CREDENTIALS }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.creds.outputs.available == 'true'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.creds.outputs.available == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.190

      - name: Add eval harness marketplace
        if: steps.creds.outputs.available == 'true'
        run: claude plugin marketplace add https://github.com/opendatahub-io/agent-eval-harness.git

      - name: Install eval harness plugin
        if: steps.creds.outputs.available == 'true'
        # Branch ref — plugin install does not support SHA pinning
        run: claude plugin install agent-eval-harness@agent-eval-harness-dev

      - name: Run eval without LLM judges for ${{ matrix.skill }}
        if: steps.creds.outputs.available == 'true'
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.GCP_EVAL_PROJECT_ID }}
          CLOUD_ML_REGION: global
          CLAUDE_MODEL: claude-haiku-4-5
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          SKILL_NAME: ${{ matrix.skill }}
        # Shell tools can read the API key; only approved, trusted content may run.
        run: |
          EVAL_CONFIG=$(find plugins -path "*/${SKILL_NAME}/eval/eval.yaml" -o -path "*/${SKILL_NAME}-eval/eval.yaml" | head -1)
          if [[ -z "$EVAL_CONFIG" ]]; then
            echo "Error: No eval.yaml found for ${SKILL_NAME}" >&2
            exit 1
          fi
          echo "LLM judges are disabled. Accessibility answer correctness is ungraded; this run does not satisfy J1." >> "$GITHUB_STEP_SUMMARY"
          claude -p "/agent-eval-harness:eval-run --config ${EVAL_CONFIG} --no-llm-judges" \
            --model claude-haiku-4-5 \
            --allowedTools "Bash,Read,Write,Edit,Skill" \
            --permission-mode dontAsk \
            --max-turns 200

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-${{ matrix.skill }}
          path: |
            **/eval/runs/*/*/summary.yaml
            **/eval/runs/*/*/run_result.json
          if-no-files-found: warn

  post-results:
    needs: [detect-changes, run-evals]
    if: always() && needs.detect-changes.outputs.has_evals == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all eval artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: eval-artifacts
          pattern: eval-*

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Generate PR comment
        run: |
          mapfile -t DIRS < <(find eval-artifacts -name summary.yaml -exec dirname {} \;)
          if [[ ${#DIRS[@]} -eq 0 ]]; then
            echo "## Skill Eval Results" > /tmp/eval-comment.md
            echo "" >> /tmp/eval-comment.md
            echo "PR eval execution is disabled to protect credentials. Run evals manually on the default branch after merge and environment approval; correctness is unverified." >> /tmp/eval-comment.md
          else
            EVAL_LLM_JUDGES_SKIPPED=true bash scripts/parse-eval-results.sh "${DIRS[@]}" > /tmp/eval-comment.md
          fi

      - name: Post or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh pr view "$PR_NUMBER" --comments --json comments \
            --jq '.comments[] | select(.body | startswith("## Skill Eval Results")) | .url' \
            | tail -1)
          if [[ -n "$EXISTING" ]]; then
            COMMENT_ID=$(echo "$EXISTING" | grep -oE '[0-9]+$')
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH -F body=@/tmp/eval-comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/eval-comment.md
          fi
