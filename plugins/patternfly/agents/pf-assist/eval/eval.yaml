name: pf-assist-eval
description: Evaluate pf-assist agent's routing — does it mention the right PF sub-skills and suggest /pf-review?

skill: ""

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code
  plugin_dirs:
    - ./plugins/patternfly/pf-code-review

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow: []
  deny:
    - "mcp__*"

dataset:
  path: cases
  schema: |
    Each case directory IS the workspace (cwd for claude --print).
    Fixture files (package.json, .tsx components) go directly in the case dir.
    - input.yaml: prompt field with an action-oriented PatternFly question
    - annotations.yaml: expected_routing (list of sub-skill names) or gate-skip
    Only the code-review plugin is loaded (plugin_dirs above). Judges verify
    the agent mentions relevant skills in its text output and suggests /pf-review
    for comprehensive checks.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: routes_to_subskills
    description: Agent mentions the expected /pf-* sub-skills in its text output
    if: "annotations.get('expected_routing', []) and annotations.get('expected_routing') != 'none'"
    check: |
      annots = outputs.get("annotations", {})
      expected = annots.get("expected_routing", [])
      text = outputs.get("conversation", "").lower()
      mentioned = [s for s in expected if s.lstrip("/").lower() in text]
      missing = [s for s in expected if s.lstrip("/").lower() not in text]
      if not mentioned:
          return False, f"No expected skills mentioned in text. Expected: {expected}"
      if missing:
          return True, f"Mentioned {mentioned}, missing {missing} (partial match acceptable)"
      return True, f"All expected skills mentioned: {mentioned}"

  - name: gate_skip_non_pf
    description: Non-PF project gets no PF-specific skill mentions
    if: "annotations.get('expected_routing') == 'none'"
    check: |
      pf_skills = []
      for event in outputs.get("events", []):
          if event.get("type") != "assistant":
              continue
          for tool in event.get("tools", []):
              if tool.get("name") == "Skill":
                  skill_name = tool.get("input", {}).get("skill", "")
                  if "pf-" in skill_name.lower():
                      pf_skills.append(skill_name)
      if pf_skills:
          return False, f"Non-PF project got PF skill invocations: {pf_skills}"
      text = outputs.get("conversation", "").lower()
      pf_subskills = [
          "pf-figma-check", "pf-color-scan", "pf-import-check",
          "pf-component-check", "pf-test-gen", "pf-figma-token-check",
          "pf-migration-scan", "pf-security-scan", "pf-project-gen",
          "pf-icon-finder", "pf-ai-audit", "pf-review"
      ]
      found_pf = [s for s in pf_subskills if s in text]
      if found_pf:
          return False, f"Non-PF project got PF-specific routing in text: {found_pf}"
      return True, "No PF skill mentions for non-PF project — gate check working"

  - name: suggests_pf_review
    description: Agent suggests /pf-review for comprehensive PatternFly checks
    if: "annotations.get('expected_routing', []) and annotations.get('expected_routing') != 'none'"
    check: |
      text = outputs.get("conversation", "").lower()
      if "pf-review" in text:
          return True, "Agent mentioned /pf-review for comprehensive checks"
      return False, "Agent did not mention /pf-review — should suggest it for comprehensive audits"

thresholds:
  routes_to_subskills:
    min_pass_rate: 1.0
  gate_skip_non_pf:
    min_pass_rate: 1.0
  suggests_pf_review:
    min_pass_rate: 0.67
