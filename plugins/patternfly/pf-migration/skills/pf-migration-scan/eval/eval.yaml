name: pf-migration-scan-eval
description: Evaluate pf-migration-scan's unified detection of CSS classes, tokens, and React API breaking changes

# A/B delta: Without the skill, baseline Claude would handle CSS and React API changes
# inconsistently — sometimes mixing them, sometimes missing one category entirely.
# The skill uniquely contributes: unified scanning across CSS classes, tokens, AND React
# API changes; severity + confidence ratings per finding; structured report template with
# separate CSS and React sections; and cross-reference with pf-codemods for PF5→PF6.

skill: pf-migration:pf-migration-scan

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow: []
  deny:
    - "mcp__*"

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: prompt field with a realistic user request
    - annotations.yaml: expect_violations/expect_findings flags and pattern lists
    - Optional fixture files (.tsx, .scss) the prompt references

outputs:
  - path: artifacts
    schema: |
      The skill produces a markdown migration report covering CSS classes,
      tokens, and React API breaking changes with file paths, replacements,
      severity, and confidence.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: flags_legacy_classes
    description: Detects legacy versioned and unversioned PF class prefixes
    if: "annotations.get('expect_violations') == True and annotations.get('violation_type') == 'legacy-classes'"
    check: |
      import re
      text = outputs.get("conversation", "")
      patterns = annotations.get("legacy_patterns", [])
      if not patterns:
          return False, "Test case missing legacy_patterns annotation"
      found = 0
      for pattern in patterns:
          if pattern in text:
              found += 1
      if found == 0:
          return False, f"Did not flag any legacy classes: {patterns}"
      if found < len(patterns):
          return False, f"Only found {found}/{len(patterns)} legacy patterns"
      return True, f"Correctly flagged all {len(patterns)} legacy class patterns"

  - name: flags_legacy_tokens
    description: Detects legacy token patterns that should use semantic tokens
    if: "annotations.get('expect_violations') == True and annotations.get('violation_type') == 'legacy-tokens'"
    check: |
      import re
      text = outputs.get("conversation", "")
      patterns = annotations.get("legacy_patterns", [])
      if not patterns:
          return False, "Test case missing legacy_patterns annotation"
      found = 0
      for pattern in patterns:
          if pattern in text:
              found += 1
      if found == 0:
          return False, f"Did not flag any legacy tokens: {patterns}"
      return True, f"Flagged {found}/{len(patterns)} legacy token patterns"

  - name: suggests_pf6_replacement
    description: Recommends PF6-appropriate replacements (pf-v6-u-* or --pf-t--*)
    if: "annotations.get('expect_violations') == True"
    check: |
      import re
      text = outputs.get("conversation", "")
      pf6_class = re.compile(r'pf-v6-')
      pf6_token = re.compile(r'--pf-t--')
      if not pf6_class.search(text) and not pf6_token.search(text):
          return False, "No PF6 replacement suggestions (pf-v6-* or --pf-t--*) found"
      return True, "Suggests PF6-appropriate replacements"

  - name: includes_confidence
    description: Output includes confidence levels for findings
    if: "annotations.get('expect_violations') == True or annotations.get('expect_findings') == True"
    check: |
      import re
      text = outputs.get("conversation", "").lower()
      confidence = re.compile(r'\b(high|medium|low)\b.*confidence|\bconfidence\b.*\b(high|medium|low)\b')
      if not confidence.search(text):
          return False, "Missing confidence levels in findings"
      return True, "Includes confidence levels"

  - name: no_false_positives
    description: Does not flag valid PF6 code as legacy
    if: "annotations.get('expect_violations') == False"
    check: |
      import re
      text = outputs.get("conversation", "")
      pf6_classes = ["pf-v6-u-ml-sm"]
      for cls in pf6_classes:
          pattern = re.compile(
              r'(legacy|deprecated|migrate|violation|replace|remove).*'
              + re.escape(cls),
              re.IGNORECASE
          )
          if pattern.search(text):
              return False, f"False positive — flagged valid PF6 class as legacy: {cls}"
      return True, "No false positives for valid PF6 code"

  - name: has_severity_and_confidence
    description: Findings include severity and confidence ratings
    if: "annotations.get('expect_findings') == True"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      severity = re.search(r'(?i)\b(critical|high|medium)\b.{0,60}(?:severity|impact|priority)', text)
      severity_alt = re.search(r'(?i)(?:severity|impact).{0,30}\b(critical|high|medium)\b', text)
      confidence = re.search(r'(?i)\b(high|medium|low)\b.{0,40}confidence', text)
      confidence_alt = re.search(r'(?i)confidence.{0,30}\b(high|medium|low)\b', text)
      has_sev = severity or severity_alt
      has_conf = confidence or confidence_alt
      if not has_sev and not has_conf:
          return False, "Findings missing both severity and confidence ratings"
      if not has_sev:
          return False, "Findings missing severity ratings (Critical/High/Medium)"
      return True, f"Findings include severity={'yes' if has_sev else 'no'}, confidence={'yes' if has_conf else 'no'}"

  - name: references_codemods
    description: References pf-codemods for PF5 to PF6 major upgrades
    if: "annotations.get('migration_type') == 'major'"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      codemod_ref = re.search(r'(?i)(pf-codemods|patternfly.{0,5}codemods)', text)
      if not codemod_ref:
          return False, "Did not reference pf-codemods for PF5→PF6 major upgrade"
      return True, "References pf-codemods for major version upgrade"

  - name: covers_both_css_and_react
    description: Report covers both CSS class and React API findings when both are present
    if: "annotations.get('has_mixed_findings') == True"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      has_css = re.search(r'(?i)(css|class|token).{0,40}(legacy|deprecated|migration|finding)', text)
      has_css_alt = re.search(r'(?i)(legacy|deprecated).{0,40}(css|class|token)', text)
      has_react = re.search(r'(?i)(react|component|prop|import).{0,40}(breaking|removed|renamed|deprecated)', text)
      has_react_alt = re.search(r'(?i)(breaking|removed|renamed).{0,40}(component|prop|import)', text)
      found_css = has_css or has_css_alt
      found_react = has_react or has_react_alt
      if not found_css and not found_react:
          return False, "Report does not cover CSS or React findings"
      if not found_css:
          return False, "Report missing CSS class/token findings"
      if not found_react:
          return False, "Report missing React API findings"
      return True, "Report covers both CSS and React migration findings"

thresholds:
  flags_legacy_classes:
    min_pass_rate: 1.0
  flags_legacy_tokens:
    min_pass_rate: 1.0
  suggests_pf6_replacement:
    min_pass_rate: 1.0
  includes_confidence:
    min_pass_rate: 1.0
  no_false_positives:
    min_pass_rate: 1.0
  has_severity_and_confidence:
    min_pass_rate: 0.67
  references_codemods:
    min_pass_rate: 0.67
  covers_both_css_and_react:
    min_pass_rate: 1.0
