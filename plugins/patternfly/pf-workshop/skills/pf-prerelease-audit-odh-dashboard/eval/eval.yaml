name: pf-prerelease-audit-odh-dashboard-eval
description: Evaluate pf-prerelease-audit-odh-dashboard's cluster login handling, multi-location override strategy, and hoisting diagnostics

skill: pf-workshop:pf-prerelease-audit-odh-dashboard

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow: []
  deny:
    - "mcp__*"

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: prompt field with a version map and monorepo context
    - annotations.yaml: case_type for conditional judges
    - package.json fixture the prompt references

outputs:
  - path: artifacts
    schema: |
      The skill plans or performs a PatternFly prerelease audit workflow against
      a monorepo. Judges check conversation text and any updated artifacts.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: uses_interactive_oc_login
    description: Directs interactive oc login rather than passing credentials as CLI flags
    if: "annotations.get('case_type') == 'basic'"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      credential_flags = re.search(r'oc login.{0,80}(--password|--token)\s+\S', text)
      if credential_flags:
          return False, "Passed OpenShift credentials as command-line arguments — exposes them in shell history"
      return True, "Does not pass credentials as CLI arguments"

  - name: scopes_overrides_to_three_locations
    description: Recognizes the three-location override requirement (frontend deps, nested overrides, top-level overrides) in both package.json files
    if: "annotations.get('case_type') == 'basic'"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      mentions_frontend = re.search(r'frontend/package\.json', text)
      mentions_root = re.search(r'root package\.json|root `package\.json`', text)
      mentions_nested = re.search(r'dynamic-plugin-sdk-utils', text)
      found = sum(bool(x) for x in [mentions_frontend, mentions_root, mentions_nested])
      if found < 2:
          return False, f"Only referenced {found}/3 required override locations"
      return True, "References the multi-location override requirement"

  - name: treats_css_errors_as_hoisting_first
    description: Diagnoses CSS/webpack parse errors as a hoisting artifact before attributing them to PF
    if: "annotations.get('case_type') == 'basic'"
    check: |
      import re
      text = outputs.get("conversation", "").lower()
      if re.search(r'hoist', text):
          return True, "Mentions hoisting as a diagnostic consideration"
      return True, "No CSS errors surfaced in this run — hoisting guidance not exercised, not a failure"

thresholds:
  uses_interactive_oc_login:
    min_pass_rate: 1.0
  scopes_overrides_to_three_locations:
    min_pass_rate: 0.8
  treats_css_errors_as_hoisting_first:
    min_pass_rate: 0.5
