phase: evaluate
waiting_for: review
checks:
  accessibility: completed
  requirements: skipped
  patternfly: skipped
reply_patterns:
  - '\brun\.md\b'
  - '\bskipped\b'
staged_artifacts:
  - artifacts/RETURNS/productize/a11y-only/run.md
reads:
  - artifacts/RETURNS/productize/a11y-only/run.md
  - checks/returns-observation.md
writes:
  artifacts/RETURNS/productize/a11y-only/run.md:
    links_to:
      - artifacts/RETURNS/productize/a11y-only/checks/accessibility.md
    patterns:
      - '2e21b8a'
      - '(?:accessibility[^\n]*completed|completed[^\n]*accessibility)'
      - '(?:requirements[^\n]*skipped|skipped[^\n]*requirements)'
      - '(?:patternfly[^\n]*skipped|skipped[^\n]*patternfly)'
  artifacts/RETURNS/productize/a11y-only/checks/accessibility.md:
    links_to:
      - checks/returns-observation.md
    patterns:
      - 'uxd-a11y-review'
      - 'A11Y-01'
      - 'A11Y-02'
      - 'sticky footer'
      - '1280\s*(?:px|[x×])'
      - '(?:small|narrow)[- ]viewport'
      - 'https://www\.w3\.org/WAI/ARIA/apg/patterns/dialog-modal/'
