name: uxd-design-handoff-eval
description: >-
  Evaluate uxd-design-handoff component mapping, state enumeration,
  acceptance criteria traceability, and output structure

skill: uxd-design:uxd-design-handoff

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code
  plugin_dirs:
    - plugins/uxd-workshop

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6
  hook: claude-haiku-4-5-20251001

permissions:
  allow: []
  deny:
    - "mcp__*"

inputs:
  tools:
    - match: Questions asked to the user via AskUserQuestion.
      prompt: |
        Answer based on the test case context in input.yaml and answers.yaml.
        Default: pick the first option or answer "yes" for confirmations.

dataset:
  path: cases
  # Missing files are skipped (asks-for-design has no fixture).
  workspace:
    files:
      - fixture-design.md
  schema: |
    Each case directory contains:
    - input.yaml: prompt field with a realistic user request
    - annotations.yaml: case_type for conditional judges
    - Optional fixture-design.md text description of the design
    - Optional answers.yaml for AskUserQuestion auto-answer guidance

outputs:
  - path: artifacts
    schema: |
      Judges check conversation text for component maps, state matrices,
      acceptance criteria, and accessibility notes. Offline cases use
      fixture-design.md; no Figma/MCP/network.
  - tool: AskUserQuestion
    schema: Design input clarifying questions.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: maps_components_to_design_system
    description: Maps UI elements to design system components with props/variants
    if: "annotations.get('case_type') == 'prototype-input'"
    check: |
      import re

      text = outputs.get("conversation", "")
      has_component_map = re.search(
          r"(Component Map|component inventory|component mapping|Component\s*\|)",
          text,
          re.IGNORECASE,
      )
      if not has_component_map:
          return False, "No component map or component inventory found"

      has_element_col = re.search(r"Element", text, re.IGNORECASE)
      has_component_col = re.search(r"Component", text, re.IGNORECASE)
      if not (has_element_col and has_component_col):
          return False, "Component map missing Element or Component columns"

      has_table = re.search(r"\|.*\|.*\|", text)
      if not has_table:
          return False, "Component map not formatted as a table"

      has_props = re.search(
          r"(variant|prop|isCompact|isStriped|Variants|Props|configuration)",
          text,
          re.IGNORECASE,
      )
      if not has_props:
          return False, "Component map does not mention variants or props"

      return True, "Mapped UI elements to design system components with props/variants"

  - name: enumerates_all_states
    description: Covers empty, loading, error, populated, partial, and responsive states
    if: "annotations.get('case_type') == 'state-enumeration'"
    check: |
      import re

      text = outputs.get("conversation", "")
      required_states = {
          "empty": r"\bempty\b",
          "loading": r"\bloading\b",
          "error": r"\berror\b",
          "populated": r"\bpopulated\b",
          "partial": r"\bpartial\b",
          "responsive": r"\bresponsive\b",
      }
      missing = []
      for state_name, pattern in required_states.items():
          if not re.search(pattern, text, re.IGNORECASE):
              missing.append(state_name)

      if missing:
          return False, f"Missing states: {', '.join(missing)}"

      has_matrix = re.search(
          r"(State Matrix|state enumeration|states?\s*(per|for|by)\s*(component|view))",
          text,
          re.IGNORECASE,
      )
      if not has_matrix:
          return False, "No state matrix or state enumeration section found"

      return True, "Enumerated all required states (empty, loading, error, populated, partial, responsive)"

  - name: generates_testable_acceptance_criteria
    description: Produces testable AC in Given/When/Then format with traceability
    if: "annotations.get('case_type') == 'generates-acceptance-criteria'"
    check: |
      import re

      text = outputs.get("conversation", "")
      has_ac_section = re.search(
          r"(Acceptance Criteria|AC-\d+)",
          text,
          re.IGNORECASE,
      )
      if not has_ac_section:
          return False, "No acceptance criteria section found"

      has_gwt = re.search(
          r"(Given .+When .+Then|given .+when .+then|GIVEN .+WHEN .+THEN)",
          text,
          re.DOTALL,
      )
      if not has_gwt:
          return False, "Acceptance criteria not in Given/When/Then format"

      has_trace = re.search(
          r"(Trace\s*:|traced? (back )?to|design (decision|spec|rationale)|research finding)",
          text,
          re.IGNORECASE,
      )
      if not has_trace:
          return False, "Acceptance criteria lack traceability to design decisions"

      vague = re.findall(
          r"AC-\d+[^|]*?(should (look|feel|be) (good|nice|intuitive|clean|modern))",
          text,
          re.IGNORECASE,
      )
      if len(vague) > 0:
          return False, f"Found vague acceptance criteria: {vague[0][0]}"

      ac_count = len(re.findall(r"\bAC-\d+\b", text))
      if ac_count < 2:
          return False, f"Only {ac_count} acceptance criteria found; expected multiple"

      return True, f"Generated {ac_count} testable acceptance criteria with traceability"

  - name: asks_for_design_input
    description: Asks for design input when none is provided
    if: "annotations.get('case_type') == 'asks-for-design'"
    check: |
      import re

      text = outputs.get("conversation", "")
      tool_calls = outputs.get("tool_calls") or []

      asked_via_tool = any(
          c.get("name") == "AskUserQuestion"
          and re.search(
              r"(design|prototype|figma|screenshot|mockup|wireframe)",
              str(c.get("input", {})),
              re.IGNORECASE,
          )
          for c in tool_calls
      )

      asks_in_text = re.search(
          r"(what design|share .{0,40}(design|prototype|screenshot|mockup)|"
          r"provide .{0,40}(design|prototype|screenshot)|"
          r"need .{0,40}(design|prototype|screenshot|mockup|input))",
          text,
          re.IGNORECASE,
      )

      if not asked_via_tool and not asks_in_text:
          return False, "Did not ask for design input when none was provided"

      fabricated = re.search(
          r"(\bAC-\d{1,3}\b|Component Map|State Matrix)",
          text,
          re.IGNORECASE,
      )
      if fabricated:
          return False, "Generated a handoff spec without receiving design input"

      return True, "Asked for design input before proceeding"

thresholds:
  maps_components_to_design_system:
    min_pass_rate: 1.0
  enumerates_all_states:
    min_pass_rate: 1.0
  generates_testable_acceptance_criteria:
    min_pass_rate: 1.0
  asks_for_design_input:
    min_pass_rate: 1.0
