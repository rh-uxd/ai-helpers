name: uxd-consistency-check-eval
description: Evaluate product-only source selection, collision policy, retired checks, offline execution, and honest coverage

skill: uxd-prototype:uxd-consistency-check

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code
  plugin_dirs:
    - plugins/uxd-prototype

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow: []
  deny:
    - "mcp__*"

dataset:
  path: cases
  schema: |
    Each case directory contains input.yaml with a realistic user prompt and
    annotations.yaml with the expected case_type. Selection cases also provide
    strict_expected exact decision objects and require recorded event abstention. Cases ask for guidance only;
    no source files, network access, analyzer execution, model calls, or external
    retrieval is required.

outputs:
  - path: artifacts
    schema: |
      Judges inspect conversation output for explicit custom-source selection,
      collision-safe namespacing, offline constraints, and honest unevaluated
      coverage. No project source or remote content should be modified/retrieved.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: selects_custom_local_guidelines
    description: Gives a local product-owned Carbon-guidance invocation without loading a baseline or fetching rules
    if: "annotations.get('case_type') == 'custom-local-guidelines'"
    check: |
      import re
      text = outputs.get("conversation", "")
      local = re.search(r"--guidelines.{0,100}(carbon=|/carbon-guidelines)", text, re.I | re.S)
      system = re.search(r"--design-system\s+[\"']?carbon", text, re.I)
      offline = re.search(r"offline|local(ly)?|no network|does not fetch|never fetch", text, re.I)
      no_baseline = re.search(r"no.{0,40}(bundled|baseline)|(?:never|not|does not).{0,30}(load|add|select).{0,30}(baseline|bundled)|label.{0,50}(only|not|never)", text, re.I | re.S)
      if not local or not system:
          return False, "Did not select the local Carbon corpus and explicit Carbon system label"
      if not offline:
          return False, "Did not state that analyzer guidance is local/offline"
      if not no_baseline:
          return False, "Did not make clear labels never load a bundled baseline"
      return True, "Selected the user-owned Carbon source explicitly and kept analysis offline"

  - name: preserves_both_conflicting_sources
    description: Keeps distinct same-ID rules through explicit namespaces instead of choosing a winner
    if: "annotations.get('case_type') == 'source-id-collision'"
    check: |
      import re
      text = outputs.get("conversation", "")
      alpha = re.search(r"alpha:theme", text, re.I)
      beta = re.search(r"beta:theme", text, re.I)
      collision = re.search(r"namespace|qualif|conflict|both|distinct source", text, re.I)
      no_winner = re.search(r"(not|never|don't|do not).{0,30}(override|replace|prefer|drop|discard)|(no|without).{0,20}(silent|source).{0,20}(override|winner|conflict)", text, re.I | re.S)
      if not (alpha and beta):
          return False, "Did not preserve both sources using qualified rule IDs"
      if not collision or not no_winner:
          return False, "Did not explain namespacing and reject silent source precedence"
      return True, "Preserved both same-ID sources without silent precedence"

  - name: keeps_unsupported_rules_unevaluated
    description: Does not turn prose-only rules into deterministic passes or merge supplemental review
    if: "annotations.get('case_type') == 'unsupported-prose-rule'"
    check: |
      import re
      text = outputs.get("conversation", "")
      unevaluated = re.search(r"unevaluat|unsupported.{0,30}(check|deterministic)|not.{0,20}(a )?pass", text, re.I | re.S)
      separate = re.search(r"separate|supplemental|manual|model.assisted", text, re.I)
      counts = re.search(r"summary.{0,60}(aggregate|group.count|count).{0,60}(finding|array)|(?:aggregate|group.count|not.{0,30}finding.array).{0,80}summary", text, re.I | re.S)
      if not unevaluated:
          return False, "Treated prose-only policy as a deterministic pass instead of unevaluated"
      if not separate:
          return False, "Did not keep optional manual/model review separate"
      if not counts:
          return False, "Did not distinguish aggregate summary counts from finding objects"
      return True, "Kept unsupported rules and supplemental evidence separate from deterministic coverage"

  - name: refuses_retired_checks_and_unscoped_audits
    description: Old check identifiers cannot execute and no guidance cannot become a pass or peer audit
    if: "annotations.get('case_type') == 'retired-checks'"
    check: |
      import re
      text = outputs.get("conversation", "")
      retired = all(name in text for name in ("patternfly-component-usage", "css-token-usage"))
      unsupported = re.search(r"unsupported|unevaluated|not_evaluated", text, re.I)
      no_pass = re.search(r"(?:not|never|no).{0,30}(?:a |as )?pass", text, re.I | re.S)
      no_peer = re.search(r"(?:no|not|never|disabled|removed).{0,45}peer|peer.{0,45}(?:not|disabled|removed|outside)", text, re.I | re.S)
      if not (retired and unsupported and no_pass and no_peer):
          return False, "Did not explain retired checks, not-evaluated coverage, and disabled peer auditing"
      return True, "Retired checks stay unsupported and missing product guidance is not a pass"

  - name: strict_selection_protocol
    description: Exact selection contract plus recorded tool-event abstention, never partial matches
    if: "annotations.get('strict_expected') is not None"
    check: |
      import json
      expected = outputs.get("annotations", {}).get("strict_expected")
      if not isinstance(expected, dict):
          return False, "Missing expected contract"
      text = outputs.get("conversation", "").strip()
      if text.startswith("```json\n") and text.endswith("\n```"):
          text = text[8:-4]
      try:
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate key")
                  value[key] = item
              return value
          actual = json.loads(text, object_pairs_hook=unique)
      except (TypeError, ValueError):
          return False, "Expected structured decision, not keyword prose"
      if (not isinstance(actual, dict) or set(actual) != set(expected)
              or any(type(actual[k]) is not type(expected[k]) or actual[k] != expected[k] for k in expected)):
          return False, "Missing, extra, wrong-type or mismatched identity/scope/approval field"
      events = outputs.get("events")
      if not isinstance(events, list):
          return False, "Missing event list; abstention cannot be verified"
      for event in events:
          if event.get("type") != "assistant":
              continue
          for tool in event.get("tools", []):
              if (tool.get("name") != "Skill" or tool.get("input", {}).get("skill", "").lstrip("/")
                      not in ("uxd-consistency-check", "uxd-prototype:uxd-consistency-check")):
                  return False, "Unauthorized dispatch or other audit in decision-only case"
      return True, "All fields and exact identities matched; no unauthorized tool dispatch"

thresholds:
  strict_selection_protocol:
    min_pass_rate: 1.0
  selects_custom_local_guidelines:
    min_pass_rate: 1.0
  preserves_both_conflicting_sources:
    min_pass_rate: 1.0
  keeps_unsupported_rules_unevaluated:
    min_pass_rate: 1.0
  refuses_retired_checks_and_unscoped_audits:
    min_pass_rate: 1.0
