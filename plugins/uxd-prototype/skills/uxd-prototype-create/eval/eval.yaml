name: uxd-prototype-create-eval
description: Evaluate onboarding, meaningful design choices, and code-check versus browser-review boundaries

skill: uxd-prototype:uxd-prototype-create

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code
  plugin_dirs:
    - plugins/uxd-prototype

models:
  skill: claude-opus-4-6
  judge: claude-sonnet-5

permissions:
  allow: []
  deny:
    - "mcp__*"

mlflow:
  experiment: uxd-prototype-create
  tags:
    team: uxd
    pipeline: prototype-evaluator

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: prompt field with a realistic user request
    - annotations.yaml: case_type for conditional judges

outputs:
  - path: artifacts
    schema: |
      For onboarding cases, judges expect clarifying questions in the
      conversation and no premature HTML/artifacts generation.
      For plan-confirm cases, judges expect an experience-oriented plan, not a configuration dump.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: asks_before_building
    description: Asks clarifying onboarding questions before writing prototype files
    if: "annotations.get('case_type') == 'onboarding-before-build'"
    check: |
      import re
      text = outputs.get("conversation", "")
      files = outputs.get("files", {}) or {}
      asks_workspace = re.search(
          r"standalone|existing codebase|workspace|integrate",
          text,
          re.IGNORECASE,
      )
      asks_mode = re.search(
          r"\bskip\b|\bauto\b|\bhuman\b|design decisions|--decisions",
          text,
          re.IGNORECASE,
      )
      asks_source = re.search(
          r"Jira|Figma|what (would you like|are we)|prototype\?",
          text,
          re.IGNORECASE,
      )
      if not (asks_workspace or asks_mode or asks_source):
          return False, "Did not ask onboarding clarifying questions"
      wrote_html = any(
          path.endswith(".html") or "patternfly.min.css" in (content or "")
          for path, content in files.items()
      )
      wrote_artifacts = any("artifacts/" in path for path in files)
      if wrote_html or wrote_artifacts:
          return False, "Built prototype files before finishing onboarding questions"
      premature = re.search(
          r"<html[\s>]|patternfly\.min\.css",
          text,
          re.IGNORECASE,
      )
      if premature and not re.search(r"(ask|before|confirm|question)", text, re.IGNORECASE):
          return False, "Appears to emit HTML before asking clarifying questions"
      return True, "Asked clarifying questions before building"

  - name: prints_prototype_plan
    description: Describes the intended experience and waits when confirmation was explicitly requested
    if: "annotations.get('case_type') == 'standalone-plan-confirm'"
    feedback_type: bool
    prompt: |
      The user has already chosen a standalone profile settings prototype with
      sensible defaults and explicitly asks to review the plan before files are written.
      Pass if the assistant describes editing profile fields, saving, and the
      standalone starting point in human language; briefly explains the prototype
      bar if mentioned; asks for agreement; and writes no files.
      Fail if it re-asks settled setup questions, presents a configuration dump
      as the plan, or starts generating. Do not require exact headings or phrases.

      {{ conversation }}
      {{ outputs }}
      {{ tool_trace }}

  - name: welcomes_first_time_user
    description: Makes first-time invocation approachable without a setup questionnaire
    if: "annotations.get('case_type') == 'onboarding-before-build'"
    feedback_type: bool
    prompt: |
      Pass if the assistant briefly introduces the skill with its version and
      purpose, then asks the next missing question in approachable terms.
      It should not demand flags or a repository URL, or ask for a decision count.
      The user provided only a desire for a settings page, so a relevant source
      clarification or existing-prototype versus fresh-start question is valid.

      {{ conversation }}
      {{ tool_trace }}

  - name: avoids_manufactured_choices
    description: Applies established patterns instead of manufacturing design decisions
    if: "annotations.get('case_type') == 'simple-design-defaults'"
    feedback_type: bool
    prompt: |
      The fixture describes a simple settings form whose requirements and workspace
      conventions already settle the experience. Pass if the assistant recognizes
      that zero unresolved design choices is valid, follows accessible form defaults,
      and does not produce alternatives simply because depth=over was supplied.
      Fail if it asks the user to vote on validation, keyboard access, hidden errors,
      cosmetic tone, or filler layout options, or asks for a number of decisions.

      {{ conversation }}
      {{ outputs }}
      {{ tool_trace }}

  - name: records_without_rebuilding
    description: Records a partial response and asks only about remaining independent choices
    if: "annotations.get('case_type') == 'partial-decision-response'"
    feedback_type: bool
    prompt: |
      Pass if the assistant records only the submitted choice in decisions.json,
      leaves the second decision pending, does not regenerate HTML or index pages,
      and gives a short acknowledgement plus the remaining question. It may ask
      for the actual decisions.json if it cannot access it, rather than inventing
      a successful write. Fail on claiming the partial response accepted all choices,
      silently using the AI suggestion for the unanswered question, or repeating
      the entire onboarding or decision kit.

      {{ conversation }}
      {{ outputs }}
      {{ tool_trace }}

  - name: keeps_browser_review_at_handoff
    description: Keeps Create checks in source and opens the prototype only for user handoff
    if: "annotations.get('case_type') == 'code-checks-before-handoff'"
    feedback_type: bool
    prompt: |
      The prototype is already generated in a PatternFly React workspace. This
      is ordinary Create, with no requested evaluation, pipeline, or export.
      Pass if the assistant keeps scoped PatternFly structure/reuse/CSS checks
      and applicable lint/build/type checks, then plans to launch or reuse the
      server and open only the entry page at final handoff for the user to review.
      Fail if it plans to browse routes, execute journeys/states, test keyboard
      behavior, run browser/E2E commands, take verification screenshots, or call
      Evaluate before handoff. Also fail if it drops code-level checks entirely
      or claims those establish runtime behavior or acceptance-criteria passes.
      The exercise explicitly requests a description only, so no tool actions
      that start a server, browser, build, or file writes should occur.

      {{ conversation }}
      {{ outputs }}
      {{ tool_trace }}

thresholds:
  asks_before_building:
    min_pass_rate: 1.0
  prints_prototype_plan:
    min_pass_rate: 1.0
  welcomes_first_time_user:
    min_pass_rate: 1.0
  avoids_manufactured_choices:
    min_pass_rate: 1.0
  records_without_rebuilding:
    min_pass_rate: 1.0
  keeps_browser_review_at_handoff:
    min_pass_rate: 1.0
