<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE@@</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css">
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly-addons.min.css">
  <style>
    /* PatternFly card anatomy and tokens; keep report styles out of the previews. */
    body {
      margin: 0;
      font-family: var(--pf-t--global--font--family--body, 'Red Hat Text', sans-serif);
      font-size: var(--pf-t--global--font--size--body--default, 1rem);
      line-height: 1.5;
      color: var(--pf-t--global--text--color--regular, #151515);
      background: var(--pf-t--global--background--color--secondary--default, #f2f2f2);
    }
    .review-report { max-width: 1280px; margin: auto; padding: var(--pf-t--global--spacer--2xl, 3rem); }
    .report-header { padding-bottom: var(--pf-t--global--spacer--xl, 2rem); }
    .eyebrow, .option-letter {
      color: var(--pf-t--global--text--color--subtle, #4d4d4d);
      font-size: var(--pf-t--global--font--size--sm, .875rem);
      font-weight: 500;
    }
    .report-header h1 { margin: .5rem 0 1rem; font-size: var(--pf-t--global--font--size--heading--h1, 2rem); }
    .project-name { font-weight: 500; margin-bottom: .5rem; }
    .report-description { max-width: 76ch; color: var(--pf-t--global--text--color--subtle, #4d4d4d); }
    .report-instructions { margin-top: 1rem; }
    .decision {
      padding: var(--pf-t--global--spacer--xl, 2rem) 0;
      border-top: 1px solid var(--pf-t--global--border--color--default, #d2d2d2);
    }
    .decision-heading h2 { margin-top: .5rem; max-width: 58ch; }
    .decision-context { margin-top: .75rem; max-width: 88ch; color: var(--pf-t--global--text--color--subtle, #4d4d4d); }
    .decision-options { border: 0; padding: 0; margin: 1.5rem 0 0; min-width: 0; }
    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: var(--pf-t--global--spacer--lg, 1.5rem); }
    .option-card {
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--pf-t--global--border--color--default, #c7c7c7);
      border-radius: var(--pf-t--global--border--radius--medium, .5rem);
      background: var(--pf-t--global--background--color--primary--default, white);
      overflow: hidden;
    }
    .option-card:has(input[data-decision]:checked) {
      border-color: var(--pf-t--global--border--color--brand--default, #0066cc);
      box-shadow: inset 0 0 0 1px var(--pf-t--global--border--color--brand--default, #0066cc);
    }
    .option-card:focus-within { outline: 2px solid var(--pf-t--global--border--color--brand--default, #0066cc); outline-offset: 3px; }
    .option-card > .pf-v6-c-card__header { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 1rem; padding: 1.5rem; }
    .option-card > .pf-v6-c-card__header > .pf-v6-c-label { margin: 0; flex-shrink: 0; }
    .choice-heading { display: flex; align-items: flex-start; gap: .75rem; flex: 1; min-width: 12rem; }
    .choice-heading input { flex-shrink: 0; width: 1rem; height: 1rem; margin-top: .25rem; accent-color: var(--pf-t--global--color--brand--default, #0066cc); cursor: pointer; }
    .choice-heading .pf-v6-c-card__title { padding: 0; min-width: 0; }
    .choice-heading .option-letter { margin: 0 0 .25rem; }
    .choice-heading label { cursor: pointer; }
    .option-card > .pf-v6-c-card__body { padding: 0 1.5rem 1.5rem; flex: 1; }
    .option-description { color: var(--pf-t--global--text--color--subtle, #4d4d4d); min-height: 3rem; }
    .visual-preview {
      margin: 1.25rem 0;
      min-height: 15rem;
      max-height: 30rem;
      overflow: auto;
      border: 1px solid var(--pf-t--global--border--color--default, #d2d2d2);
      border-radius: var(--pf-t--global--border--radius--small, .25rem);
      background: var(--pf-t--global--background--color--secondary--default, #f2f2f2);
    }
    .visual-preview * { pointer-events: none; }
    .suggestion-reason { border-left: 3px solid var(--pf-t--global--border--color--brand--default, #0066cc); padding: .75rem 1rem; margin-bottom: 1.25rem; background: var(--pf-t--global--background--color--secondary--default, #f2f2f2); font-size: .875rem; }
    .tradeoffs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; font-size: .875rem; }
    .tradeoff-heading { margin-bottom: .5rem; font-weight: 600; }
    .tradeoffs .pf-v6-c-list { padding-left: 1.25rem; }
    .option-card > .pf-v6-c-card__footer { padding: 1rem 1.5rem; border-top: 1px solid var(--pf-t--global--border--color--default, #d2d2d2); }
    .when-to-use { color: var(--pf-t--global--text--color--subtle, #4d4d4d); font-size: .875rem; }
    .comparison { margin-top: 1.5rem; }
    .comparison-heading { font-size: 1rem; font-weight: 600; margin-bottom: .75rem; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--pf-t--global--border--color--default, #d2d2d2); border-radius: .25rem; }
    .comparison table { width: 100%; border-collapse: collapse; background: var(--pf-t--global--background--color--primary--default, white); }
    .comparison th, .comparison td { padding: .875rem 1rem; text-align: left; border-bottom: 1px solid var(--pf-t--global--border--color--default, #d2d2d2); }
    .comparison tbody tr:last-child > * { border-bottom: 0; }
    .comparison thead { background: var(--pf-t--global--background--color--secondary--default, #f2f2f2); }
    .custom-choice { margin-top: 1rem; }
    .response-panel { margin-top: 1rem; border-radius: .5rem; background: var(--pf-t--global--background--color--primary--default, white); }
    .response-panel > .pf-v6-c-card__title { padding: 1.5rem 1.5rem .5rem; }
    .response-panel > .pf-v6-c-card__body { padding: 0 1.5rem 1.5rem; }
    .response-panel > .pf-v6-c-card__footer { padding: 0 1.5rem 1.5rem; }
    .choice-progress { margin: 1rem 0 .5rem; color: var(--pf-t--global--text--color--subtle, #4d4d4d); font-size: .875rem; }
    .response-text { display: block; box-sizing: border-box; width: 100%; padding: 1rem; border: 1px solid var(--pf-t--global--border--color--default, #c7c7c7); border-radius: .25rem; background: var(--pf-t--global--background--color--secondary--default, #f8f8f8); color: inherit; font: inherit; line-height: 1.65; resize: vertical; }
    .response-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .response-actions p { color: var(--pf-t--global--text--color--subtle, #4d4d4d); }
    .response-actions button { cursor: pointer; }
    .response-actions button:disabled { cursor: default; }
    .response-text:focus-visible, .response-actions button:focus-visible { outline: 2px solid var(--pf-t--global--border--color--brand--default, #0066cc); outline-offset: 3px; }
    @media (max-width: 700px) {
      .review-report { padding: 1.25rem; }
      .tradeoffs { grid-template-columns: 1fr; }
      .option-description { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="review-report">
    <header class="report-header">
      <p class="eyebrow">Prototype design review</p>
      <h1 class="pf-v6-c-title pf-m-2xl">@@TITLE@@</h1>
      <p class="project-name">@@PROJECT@@</p>
      <p class="report-description">@@DESCRIPTION@@</p>
      <p class="report-instructions">Choose your preferred option for each decision.</p>
    </header>
    @@CONTENT@@
    @@RESPONSE@@
  </main>
  <script type="application/json" id="decision-data">@@DATA@@</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('decision-data').textContent);
      const response = document.getElementById('choice-response');
      const progress = document.getElementById('choice-progress');
      const status = document.getElementById('copy-status');
      const inputs = Array.from(document.querySelectorAll('input[data-decision]'));
      function update() {
        const choices = data.decisions.flatMap((decision, index) => {
          const selected = inputs.find(input => input.dataset.decision === decision.id && input.checked);
          const option = decision.options.find(option => option.id === selected?.value);
          const answer = option
            ? `Option ${option.id} — ${option.title}`
            : decision.custom
              ? `Custom — ${decision.custom.title}\n   Reasoning — ${decision.custom.reasoning}`
              : null;
          return answer ? [`${index + 1}. ${decision.title}\n   ${answer}`] : [];
        });
        response.value = choices.length
          ? `My design choices for ${data.prototypeId}:\n\n${choices.join('\n\n')}`
          : 'Choose an option above to prepare your response.';
        response.rows = Math.max(5, response.value.split('\n').length + 1);
        progress.textContent = `${choices.length} of ${data.decisions.length} choices selected`;
        document.getElementById('copy-response').disabled = !choices.length;
        status.textContent = '';
      }
      inputs.forEach(input => input.addEventListener('change', update));
      document.getElementById('copy-response').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(response.value);
          status.textContent = 'Copied. Paste it back to the agent.';
        } catch (_) {
          response.focus();
          response.select();
          status.textContent = 'Copy the highlighted text and paste it back to the agent.';
        }
      });
      update();
    })();
  </script>
</body>
</html>
