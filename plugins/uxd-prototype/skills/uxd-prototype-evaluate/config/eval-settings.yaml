# Eval Pipeline Settings
# Configuration specific to the eval pipeline and usability testing.

# Product guidelines are selected explicitly through the installed sibling
# uxd-consistency-check; no design-system clone or default policy is configured.

# --- Usability Testing Integration ---
# Cloned automatically by bootstrap-usability-testing.sh when a git URL is set
# (USABILITY_TESTING_REPO or overlay context_repos.usability_testing).
usability_testing:
  repo: ""
  context_path: .context/usability-testing/
  personas_dir: personas/
  rubric: prompts/evaluate-flow.md
  dimensions:
    - workflow_continuity
    - cross_persona_handoffs
    - scalability_complexity
    - system_status_trust
    - technical_abstraction
    - mental_model_fidelity
    - accessibility_inclusion

# --- Eval Defaults ---
defaults:
  depth: deep
  mode: informed
  max_iterations: 3
