# Report hosting configuration
# Used by scripts/publish-report.sh
#
# FIRST-RUN SETUP: set GITLAB_PAGES_REPO / PAGES_BASE_URL or edit the values below.
# Evaluation works without publishing; CI skill tests remain under eval/.
# Local review runs: artifacts/<KEY>/prototype-evaluations/<run-name>/.

# Hosted prototype reports repo — set to your team's GitLab Pages repo
gitlab_pages_repo: ""

# Site base URL. Reports: <base>/prototype-evaluations/<KEY>/.
pages_base_url: ""

# Default branch of the pages repo
pages_branch: "main"

# Hosted HTML only, not the local JSON run directory above.
# Pages serves public/ as the site root; matching URLs use the remaining path.
reports_dir: "public/prototype-evaluations"

# Optional Jira base URL for index links (override with JIRA_BASE_URL).
jira_base_url: ""

# Publish mode: "pages" (Pages hosting) or "branch" (raw file on reports branch)
default_mode: "pages"

# Git identity for commits to the pages repo (reads from git config if unset)
git_user_name: ""
git_user_email: ""

# For branch mode: which remote and branch to push reports to
branch_remote: "origin"
branch_name: "reports"
