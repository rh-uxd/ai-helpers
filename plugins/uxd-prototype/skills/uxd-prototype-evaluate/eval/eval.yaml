name: uxd-prototype-evaluate-eval
description: Preparation-only selected Quick/Full scope, conditional intake, independent walkthrough handoff
  and immutable canonical history
skill: uxd-prototype:uxd-prototype-evaluate
execution:
  mode: case
  arguments: '{prompt}'
runner:
  type: claude-code
  plugin_dirs:
  - plugins/uxd-prototype
models:
  skill: claude-opus-4-6
  judge: claude-sonnet-5
permissions:
  allow: []
  deny:
  - mcp__*
dataset:
  path: split-cases
  schema: 'Each directory contains input.yaml (prompt) and annotations.yaml (route). Preparation only:
    dedicated local reads/discovery and questions are allowed. No shell/code execution, setup, delegation,
    browser/provider work, edits or sharing. Unknown/malformed calls fail closed. Historical cases/ and
    its legacy fixtures are not loaded.'
outputs:
- path: artifacts
  schema: Conversation and tool traces describe a scoped plan/questions only. No execution artifacts or
    fabricated findings expected. Vocabulary gates are coarse regressions, not semantic proof or live
    acceptance.
traces:
  stdout: true
  stderr: true
  events: true
  metrics: true
judges:
- name: prepares_selected_canonical_workflow
  description: Fail-closed preparation tool policy plus coarse route/scope vocabulary checks; manual response/trace
    review remains required
  check: |
    text = outputs.get("conversation", "").lower()
    # Preparation-only policy (shared with agent/walkthrough preparation evals).
    # Dedicated local reads/discovery and questions only. Never classify a shell
    # command by substrings: even `cat` via an executor is outside this policy.
    # Names are exact aliases, not suffix matches; MCP/browser/provider reads are
    # intentionally NOT local instruction reads. Unknown/malformed calls fail shut.
    import json
    allowed = {
        "read", "read_file", "readfile", "glob", "grep", "search_files",
        "list_directory", "list_dir", "ls", "askuserquestion", "askquestion",
        "ask_user_question", "request_user_input",
    }
    wrappers = {"multi_tool_use.parallel": "tool_uses", "tool_call": "calls"}
    call_types = {"function", "function_call", "custom_tool_call", "tool_call", "tool_use"}
    result_types = {"tool_result", "function_call_output", "custom_tool_call_output"}
    call_lists = {"tool_calls", "tool_uses", "calls"}

    def alias(name):
        if not isinstance(name, str):
            return ""
        name = name.lower()
        return name[len("functions."):] if name.startswith("functions.") else name

    def safe_list(value, depth):
        return isinstance(value, list) and all(isinstance(v, dict) and safe_node(v, True, depth + 1) for v in value)

    def safe_node(node, required=False, depth=0):
        if depth > 40:
            return False
        if isinstance(node, list):
            return all(safe_node(v, required, depth + 1) for v in node)
        if not isinstance(node, dict):
            return not required
        kind = node.get("type", "")
        if not isinstance(kind, str):
            return False
        # Include Codex command_execution and unknown future execution/call types.
        tool_kind = any(token in kind for token in ("tool", "function", "execution", "_call"))
        named = any(k in node for k in ("tool", "tool_name", "recipient_name", "function"))
        named = named or ("name" in node and any(k in node for k in ("input", "arguments", "parameters")))
        is_call = required or kind in call_types or named
        if tool_kind and kind not in call_types | result_types:
            return False
        if is_call:
            if kind and kind not in call_types:
                return False
            names = [node[k] for k in ("name", "tool_name", "recipient_name") if k in node]
            for key in ("tool", "function"):
                if key in node:
                    value = node[key]
                    if isinstance(value, dict):
                        names.append(value.get("name"))
                    elif key == "tool":
                        names.append(value)
                    else:
                        return False
            if not names:
                # Some hosts wrap the actual call in data/payload/call.
                nested = [node[k] for k in ("data", "payload", "call") if k in node]
                if not nested or not all(safe_node(v, True, depth + 1) for v in nested):
                    return False
            else:
                names = {alias(name) for name in names}
                if len(names) != 1:
                    return False
                name = next(iter(names))
                if name in wrappers:
                    envelopes = [node] + [node[k] for k in ("function", "tool") if isinstance(node.get(k), dict)]
                    payloads = [e[k] for e in envelopes for k in ("input", "arguments", "parameters") if k in e]
                    if not payloads:
                        return False
                    for payload in payloads:
                        if isinstance(payload, str):
                            try:
                                payload = json.loads(payload)
                            except (ValueError, TypeError):
                                return False
                        key = wrappers[name]
                        if not isinstance(payload, dict) or not payload.get(key):
                            return False
                        if not safe_list(payload[key], depth + 1):
                            return False
                elif name not in allowed:
                    return False
        for key, value in node.items():
            if key in call_lists:
                if not safe_list(value, depth + 1):
                    return False
            # Inspect structured envelopes too, but never parse arbitrary prose
            # as event JSON. Only dispatcher arguments are decoded above.
            elif isinstance(value, (dict, list)) and not safe_node(value, False, depth + 1):
                return False
        return True

    if "tool_calls" in outputs and not safe_list(outputs["tool_calls"], 0):
        return False, "Preparation-only case requires read/question-only tools"
    for source in ("events", "messages"):
        if source in outputs:
            if not isinstance(outputs[source], list) or not safe_node(outputs[source]):
                return False, "Preparation-only case contains unsafe or malformed tool events"


    # Coarse vocabulary regressions only, not semantic or live-host acceptance.
    # Review actual responses and traces after an explicitly approved harness run.
    import re
    if re.search(r"(?:i will|i'll|let's)\s+(?:automatically\s+)?(?:run all personas|delete|clear|wipe|publish)", text):
        return False, "Preparation cannot broaden scope, delete runs or publish"
    if re.search(r"(?:phase b|walkthroughs?)\s+(?:always|automatically)\s+(?:runs?|fires?|starts?)", text):
        return False, "Walkthroughs need an explicit selected continuation"

    def groups(*alternatives):
        return all(any(word in text for word in choices) for choices in alternatives)

    route = outputs.get("annotations", {}).get("route", "")
    if route == "source-only":
        ok = groups(["quick"], ["spec"], ["source"], ["commit", "revision"], ["base"], ["companion", "dependency"], ["jira is not required", "no jira", "jira isn't required"], ["no browser", "without browser", "do not probe", "no server"], ["url field", "url metadata"], ["no personas", "without personas"])
    elif route == "quick":
        ok = groups(["quick"], ["classification", "classify"], ["selected", "only"], ["not_run", "not run", "unverified"], ["no personas", "without personas"], ["no fixes", "no edits", "without edits"], ["no browser", "without browser"], ["not pass", "not proof of pass", "does not prove pass"])
    elif route == "full":
        ok = groups(["quick"], ["awaiting-review"], ["findings"], ["skipped"], ["cohort"], ["run id", "run_id"], ["digest", "artifact_sha256"], ["explicit", "separate"], ["approval", "decision"], ["continue"], ["finish without", "complete without", "complete-without-walkthroughs"], ["child"], ["parent"])
    elif route == "continuation":
        ok = groups(["awaiting-review"], ["run id", "run_id"], ["digest", "artifact_sha256"], ["approval"], ["frozen", "unchanged"], ["child"], ["parent"], ["no rerun", "without rerunning", "do not rerun"], ["stale", "mismatch"], ["stop", "reject"])
    elif route == "walkthroughs":
        ok = groups(["uxd-prototype-walkthrough"], ["junior"], ["create"], ["single", "only"], ["independent", "without quick"], ["served revision", "served build"], ["browser"], ["provider"], ["approval", "authorization"], ["screenshot"], ["dom"], ["not human", "not participant"], ["not_run", "unverified"])
    elif route == "history":
        ok = all(name in text for name in ["pe-context.json", "pe-state.json", "pe-evaluation-snapshot.json", "pe-evidence.json", "pe-actions.json"])
        ok = ok and groups(["receipt"], ["hash"], ["revision"], ["scope"], ["timestamp", "when"], ["lineage", "parent"], ["not authority", "not authoritative"], ["csv"], ["no rerun", "without rerunning", "do not rerun"], ["proposal", "propose"], ["no edits", "without editing", "do not edit"])
    elif route == "fresh":
        ok = groups(["fresh"], ["consumer"], ["outside"], ["skill"], ["preserve", "immutable"], ["no deletion", "do not delete", "never delete"], ["no overwrite", "do not overwrite", "never overwrite"], ["no cache restore", "do not copy", "never copy"], ["evidence"])
    elif route == "consent":
        ok = groups(["json"], ["not authorization", "cannot grant", "does not grant"], ["human", "designer"], ["browser"], ["provider"], ["edit"], ["report"], ["sharing"], ["separate"], ["default off", "opt-in"], ["selected action", "action ids", "action_ids"], ["target files", "changed-file", "changed_files"], ["one verification", "pass 2", "pass two"], ["third pass", "pass 3"], ["not publish", "does not publish", "no publishing"])
    elif route == "missing-history":
        ok = groups(["canonical"], ["missing", "invalid", "unavailable"], ["cannot", "unknown"], ["no rerun", "do not rerun", "without rerunning"], ["root", "run path"], ["approval", "decision"], ["csv"], ["not authority", "not authoritative"])
    else:
        return False, "Unknown preparation route"
    return bool(ok), "Coarse route/scope vocabulary gate; inspect real responses and traces for acceptance"
thresholds:
  prepares_selected_canonical_workflow:
    min_pass_rate: 1.0
