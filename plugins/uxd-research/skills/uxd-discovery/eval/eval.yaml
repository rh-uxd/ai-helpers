name: uxd-discovery-eval
description: >-
  Evaluate uxd-discovery brief generation, input handling, and output structure

skill: uxd-research:uxd-discovery

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code
  plugin_dirs:
    - plugins/uxd-workshop

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6
  hook: claude-haiku-4-5-20251001

permissions:
  allow: []
  deny:
    - "mcp__*"

inputs:
  tools:
    - match: Questions asked to the user via AskUserQuestion.
      prompt: |
        Answer based on the test case context in input.yaml and answers.yaml.
        Default: pick the first option or answer "yes" for confirmations.

dataset:
  path: cases
  workspace:
    files:
      - fixture-jira.md
  schema: |
    Each case directory contains:
    - input.yaml: prompt field with a realistic user request
    - annotations.yaml: case_type for conditional judges
    - Optional answers.yaml for AskUserQuestion auto-answer guidance
    - Optional fixture-jira.md simulating Jira issue content

outputs:
  - tool: AskUserQuestion
    schema: Clarifying questions about the problem, user groups, or strategic decisions.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: produces_complete_brief
    description: Produces a discovery brief with all required sections
    if: "annotations.get('case_type') == 'jira-input'"
    check: |
      import re

      text = outputs.get("conversation", "")
      has_problem = re.search(r"Problem Statement", text, re.IGNORECASE)
      has_users = re.search(r"User Groups", text, re.IGNORECASE)
      has_decisions = re.search(r"Strategic Decisions", text, re.IGNORECASE)
      has_landscape = re.search(r"Competitive Landscape", text, re.IGNORECASE)
      has_constraints = re.search(r"Constraints", text, re.IGNORECASE)
      missing = []
      if not has_problem:
          missing.append("Problem Statement")
      if not has_users:
          missing.append("User Groups")
      if not has_decisions:
          missing.append("Strategic Decisions")
      if not has_landscape:
          missing.append("Competitive Landscape")
      if not has_constraints:
          missing.append("Constraints")
      if missing:
          return False, f"Missing required brief sections: {', '.join(missing)}"
      return True, "Discovery brief contains all required sections"

  - name: structured_output
    description: Produces structured markdown output from a feature description
    if: "annotations.get('case_type') == 'feature-description'"
    check: |
      import re

      text = outputs.get("conversation", "")
      has_problem = re.search(r"Problem Statement", text, re.IGNORECASE)
      has_users = re.search(r"User Groups", text, re.IGNORECASE)
      has_decisions = re.search(r"Strategic Decisions", text, re.IGNORECASE)
      has_landscape = re.search(r"Competitive Landscape", text, re.IGNORECASE)
      has_constraints = re.search(r"Constraints|Assumptions", text, re.IGNORECASE)
      if not (has_problem and has_users and has_decisions and has_landscape and has_constraints):
          return False, "Brief is missing one or more required sections"
      has_markdown_structure = (
          re.search(r"^#{1,3}\s", text, re.MULTILINE)
          and re.search(r"(\|.*\|.*\||\- \[[ x]\]|^\d+\.\s)", text, re.MULTILINE)
      )
      if not has_markdown_structure:
          return False, "Output lacks structured markdown formatting"
      return True, "Produced structured markdown brief from feature description"

  - name: user_groups_have_detail
    description: User groups include descriptions, goals, and pain points
    if: "annotations.get('case_type') == 'identifies-user-groups'"
    check: |
      import re

      text = outputs.get("conversation", "")
      has_users = re.search(r"User Groups", text, re.IGNORECASE)
      if not has_users:
          return False, "No User Groups section found"
      has_description = re.search(r"Description\s*:", text, re.IGNORECASE)
      has_goals = re.search(r"Goals?\s*:", text, re.IGNORECASE)
      has_pain = re.search(r"Pain\s*points?\s*:", text, re.IGNORECASE)
      missing = []
      if not has_description:
          missing.append("Description")
      if not has_goals:
          missing.append("Goals")
      if not has_pain:
          missing.append("Pain points")
      if missing:
          return False, f"User groups missing fields: {', '.join(missing)}"
      group_count = len(re.findall(r"^###\s+", text, re.MULTILINE))
      if group_count < 2:
          return False, f"Expected at least 2 user groups, found {group_count}"
      return True, "User groups include descriptions, goals, and pain points"

  - name: asks_when_no_input
    description: Asks for input when none is provided rather than fabricating
    if: "annotations.get('case_type') == 'asks-for-input'"
    check: |
      import re, json

      text = outputs.get("conversation", "")
      tool_calls = outputs.get("tool_calls") or []
      asked_via_tool = any(
          c.get("name") == "AskUserQuestion"
          and re.search(
              r"(problem|feature|issue|topic|brief|discovery|describe)",
              json.dumps(c.get("input", {})),
              re.IGNORECASE,
          )
          for c in tool_calls
      )
      asks_in_text = re.search(
          r"(what (problem|feature|issue|topic)|what should this|"
          r"what would you like|could you (share|provide|describe)|"
          r"please (share|provide|describe)|tell me (about|more))",
          text,
          re.IGNORECASE,
      )
      if not asked_via_tool and not asks_in_text:
          return False, "Did not ask the user for input"
      fabricated = re.search(
          r"(Discovery Brief:.*\n.*Problem Statement)",
          text,
          re.IGNORECASE | re.DOTALL,
      )
      if fabricated and not asked_via_tool and not asks_in_text:
          return False, "Fabricated a brief without asking for input"
      return True, "Asked for input when none was provided"

thresholds:
  produces_complete_brief:
    min_pass_rate: 1.0
  structured_output:
    min_pass_rate: 1.0
  user_groups_have_detail:
    min_pass_rate: 1.0
  asks_when_no_input:
    min_pass_rate: 1.0
